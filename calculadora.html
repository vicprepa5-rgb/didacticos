
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Parciales</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            margin: 0;
            padding: 100px 20px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* MENSAJE INSTITUCIONAL SUPERIOR */
        .mensaje-superior {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            background-color: #000;
            color: #fff;
            text-align: center;
            padding: 14px 20px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            border-bottom: 2px solid #444;
            z-index: 9999;
        }

        /* TARJETA DE LA CALCULADORA */
        .card {
            background: #3dd6f2;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.5;
        }

        .aprobado {
            background-color: #89de6c;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .ordinario {
            background-color: #f6d51c;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .extraordinario {
            background-color: #eb4c5a;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ADAPTACIÓN PARA CELULARES */
        @media (max-width: 480px) {
            body {
                padding: 95px 15px 20px;
            }

            .mensaje-superior {
                font-size: 11px;
                padding: 10px 12px;
            }

            .card {
                padding: 20px;
            }
        }

    </style>
</head>

<body>

    <!-- AVISO INSTITUCIONAL -->
    <div class="mensaje-superior">
        La presente calculadora solo es informativa para corroborar tus
        calificaciones oficiales. Verifica tu portal de alumno de
        Servicios Escolares.
    </div>

    <!-- CALCULADORA -->
    <div class="card">

        <h2>Calculadora de Parciales</h2>

        <div class="form-group">
            <label for="parcial1">
                Calificación Primer Parcial (0-10):
            </label>

            <input type="number"
                id="parcial1"
                min="0"
                max="10"
                step="0.1"
                placeholder="Ej. 8.5"
                oninput="calcular()">
        </div>

        <div class="form-group">
            <label for="parcial2">
                Calificación Segundo Parcial (0-10):
            </label>

            <input type="number"
                id="parcial2"
                min="0"
                max="10"
                step="0.1"
                placeholder="Ej. 7.5"
                oninput="calcular()">
        </div>

        <div class="form-group"
            id="grupoOrdinario"
            style="display: none;">

            <label for="ordinarioInput">
                Calificación Examen Ordinario (0-10):
            </label>

            <input type="number"
                id="ordinarioInput"
                min="0"
                max="10"
                step="0.1"
                placeholder="Ej. 7.0"
                oninput="calcular()">
        </div>

        <div id="resultadoBox"
            class="result"
            style="display: none;">

            <span id="textoResultado"></span>

        </div>

    </div>

    <script>

        function calcular() {

            const p1 = parseFloat(
                document.getElementById('parcial1').value
            );

            const p2 = parseFloat(
                document.getElementById('parcial2').value
            );

            const ordInput = document.getElementById('ordinarioInput');
            const ordGroup = document.getElementById('grupoOrdinario');
            const box = document.getElementById('resultadoBox');
            const texto = document.getElementById('textoResultado');

            // VALIDACIÓN DE LOS PARCIALES

            if (
                isNaN(p1) || isNaN(p2) ||
                p1 < 0 || p1 > 10 ||
                p2 < 0 || p2 > 10
            ) {
                box.style.display = 'none';
                ordGroup.style.display = 'none';
                ordInput.value = '';
                return;
            }

            // CÁLCULO DE LOS DOS PARCIALES

            const sumaParciales = p1 + p2;
            const promedioParciales = sumaParciales / 2;

            const promedioTexto = promedioParciales.toFixed(2);

            // LEYENDA PERSONALIZADA

            const leyendaBendicion =
                "<br><br><strong>Dios te quiere</strong>" +
                "<br><small style='font-size:13px; font-weight:normal;'>" +
                "(Si eres ateo, la Madre Tierra te ama 🌍)" +
                "</small>";

            // CRITERIO 1:
            // PROMEDIO DE PARCIALES DE 5.9 O MENOS
            // PASA DIRECTAMENTE A EXTRAORDINARIO

            if (promedioParciales <= 5.9) {

                ordGroup.style.display = 'none';
                ordInput.value = '';

                box.style.display = 'block';
                box.className = 'result extraordinario';

                texto.innerHTML =
                    `Suma parciales: ${sumaParciales.toFixed(1)}
                    <br>Promedio: ${promedioTexto}
                    <br>❌ Estás en examen extraordinario.`;

                return;
            }

            // CRITERIO 2:
            // PROMEDIO DE 8 O MÁS
            // EXENTA EL EXAMEN ORDINARIO

            if (promedioParciales >= 8.0) {

                ordGroup.style.display = 'none';
                ordInput.value = '';

                box.style.display = 'block';
                box.className = 'result aprobado';

                texto.innerHTML =
                    `Suma parciales: ${sumaParciales.toFixed(1)}
                    <br>Promedio: ${promedioTexto}
                    <br>🎉 ¡Aprobado! Exentas el ordinario.${leyendaBendicion}`;

                return;
            }

            // CRITERIO 3:
            // DEBE PRESENTAR EXAMEN ORDINARIO

            ordGroup.style.display = 'block';

            const ordVal = parseFloat(ordInput.value);

            if (isNaN(ordVal)) {

                box.style.display = 'block';
                box.className = 'result ordinario';

                texto.innerHTML =
                    `Suma parciales: ${sumaParciales.toFixed(1)}
                    <br>Promedio: ${promedioTexto}
                    <br>⚠️ Presentas examen ordinario. Ingresa tu calificación.`;

                return;
            }

            // VALIDAR CALIFICACIÓN DEL ORDINARIO

            if (ordVal < 0 || ordVal > 10) {

                box.style.display = 'none';
                return;
            }

            // ==========================================
            // CÁLCULO CORRECTO DEL PROMEDIO FINAL
            // ==========================================

            // Se suman las TRES evaluaciones
            const sumaTotal = p1 + p2 + ordVal;

            // Se divide entre TRES
            const finalPromedio = sumaTotal / 3;

            // REDONDEO INSTITUCIONAL:
            // 5.95 O MÁS ACREDITA CON CALIFICACIÓN DE 6

            let finalPromedioTexto;

            if (finalPromedio >= 5.95 && finalPromedio < 6) {
                finalPromedioTexto = "6";
            } else {
                finalPromedioTexto = finalPromedio.toFixed(2);
            }

            box.style.display = 'block';

            // ==========================================
            // RESULTADO FINAL
            // ==========================================

            if (finalPromedio >= 5.95) {

                box.className = 'result aprobado';

                texto.innerHTML =
                    `Suma de las tres evaluaciones: ${sumaTotal.toFixed(1)}
                    <br>Promedio Final: ${finalPromedioTexto}
                    <br>🎉 ¡Aprobaste la materia!${leyendaBendicion}`;

            } else {

                box.className = 'result extraordinario';

                texto.innerHTML =
                    `Suma de las tres evaluaciones: ${sumaTotal.toFixed(1)}
                    <br>Promedio Final: ${finalPromedioTexto}
                    <br>❌ Estás en examen extraordinario.`;

            }

        }

    </script>

</body>
</html>
